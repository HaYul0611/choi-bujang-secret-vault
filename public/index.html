<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-container">
    <!-- 상단 헤더 -->
    <header class="top-bar">
      <div class="brand-tag">
        <span class="brand-dot"></span>
        BYTE BACK · SECRET VAULT
      </div>
      <div class="header-status-badge">
        <span class="status-indicator"></span> 시스템 정상 보호 중
      </div>
    </header>

    <!-- 히어로 섹션 -->
    <section class="hero">
      <div class="hero-badge">🔒 SECURED VAULT</div>
      <h1>점령된 자료실</h1>
      <p>인가된 신원만 안전하게 열람 및 관리할 수 있는 격리된 보안 금고입니다.</p>
    </section>

    <!-- 메인 대시보드 레이아웃 -->
    <main class="main-layout" id="main-layout">
      <!-- 1. 인증 및 메모 작성 카드 -->
      <section class="card" id="auth-container">
        <!-- 로그인 / 회원가입 섹션 (로그인 전 표시) -->
        <div id="login-section">
          <div class="auth-tabs">
            <button type="button" class="tab-btn active" id="tab-login">로그인</button>
            <button type="button" class="tab-btn" id="tab-signup">회원가입</button>
          </div>
          
          <form class="form-group" id="login-form">
            <input type="email" id="login-email" placeholder="이메일 주소" required autocomplete="email" />
            <input type="password" id="login-password" placeholder="비밀번호 (6자 이상)" required autocomplete="current-password" />
            <button type="submit" class="btn-primary" id="btn-login">로그인</button>
          </form>
          <div class="auth-message-msg" id="auth-msg" style="display: none;"></div>
          <div class="auth-error-msg" id="login-error" style="display: none;"></div>
        </div>

        <!-- 사용자 세션 & 메모 작성 섹션 (로그인 후 표시) -->
        <div id="user-section" style="display: none;">
          <div class="user-bar">
            <div class="user-badge">
              접속 계정: <strong id="user-email-display"></strong>
            </div>
            <button type="button" class="btn-secondary" id="btn-logout">로그아웃</button>
          </div>

          <div class="card-subtitle">새 보안 메모 작성</div>
          <form class="form-group" id="create-note-form">
            <input type="text" id="new-note-title" placeholder="새 메모 제목" required />
            <textarea id="new-note-body" placeholder="보관할 메모 본문 내용을 입력하세요" rows="4" required></textarea>
            <button type="submit" class="btn-primary" id="btn-create-note">메모 저장</button>
          </form>
        </div>
      </section>

      <!-- 2. 보관된 메모 목록 섹션 (로그인 후 활성화) -->
      <section class="notes-section" id="notes-section" style="display: none;">
        <div class="section-header">
          <div class="section-title">보관된 메모 목록</div>
          <div class="note-count-badge" id="notes-count">보안 보관 중</div>
        </div>
        <ul id="notes" aria-live="polite">
          <li class="empty-item">자료실 동기화 중...</li>
        </ul>
      </section>
    </main>
  </div>

  <!-- 화면 우측 하단 플로팅 테마 스위치 토글 -->
  <aside class="floating-theme-container">
    <button type="button" class="theme-switch" id="themeToggle" aria-label="테마 전환" role="switch" aria-checked="false" title="화면 모드 전환">
      <div class="theme-switch-knob">
        <span class="theme-switch-icon" id="themeIcon">☀️</span>
      </div>
    </button>
  </aside>

  <script type="module" src="/app.js"></script>
</body>
</html>
