<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="dns-prefetch" href="https://jrsoosoflveipirsqokx.supabase.co">
  <link rel="preconnect" href="https://jrsoosoflveipirsqokx.supabase.co" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <!-- 상단 헤더 및 스위치 토글 -->
    <header class="top-bar">
      <div class="brand-tag">BYTE BACK · SECRET VAULT</div>
      <button type="button" class="theme-switch" id="themeToggle" aria-label="테마 전환" role="switch" aria-checked="false">
        <div class="theme-switch-knob">
          <span class="theme-switch-icon" id="themeIcon">☀️</span>
        </div>
      </button>
    </header>

    <!-- 히어로 섹션 -->
    <section class="hero">
      <h1>점령된 자료실</h1>
      <p>인증된 사용자만 접근할 수 있는 내부 보관 자료실입니다.</p>
    </section>

    <!-- 인증 & 작성 카드 -->
    <div class="card" id="auth-container">
      <div id="login-section">
        <h2>사용자 로그인</h2>
        <form class="form-group" id="login-form">
          <input type="email" id="login-email" placeholder="이메일 주소" required autocomplete="email" />
          <input type="password" id="login-password" placeholder="비밀번호" required autocomplete="current-password" />
          <button type="submit" class="btn-primary" id="btn-login">로그인</button>
        </form>
        <div class="auth-error-msg" id="login-error" style="display: none;"></div>
      </div>

      <div id="user-section" style="display: none;">
        <div class="user-bar">
          <div class="user-badge">
            접속 계정: <strong id="user-email-display"></strong>
          </div>
          <button type="button" class="btn-secondary" id="btn-logout">로그아웃</button>
        </div>

        <form class="form-group" id="create-note-form">
          <input type="text" id="new-note-title" placeholder="새 메모 제목" required />
          <textarea id="new-note-body" placeholder="메모 본문 내용을 입력하세요" rows="3" required></textarea>
          <button type="submit" class="btn-primary" id="btn-create-note">메모 추가</button>
        </form>
      </div>
    </div>

    <!-- 메모 목록 섹션 -->
    <div class="section-title">보관된 메모</div>
    <ul id="notes" aria-live="polite">
      <li class="empty-item">상태 확인 중...</li>
    </ul>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
