<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #0f172a; color: #f8fafc; }
    main { max-width: 680px; margin: 0 auto; padding: 56px 20px 80px; }
    
    .eyebrow { color: #38bdf8; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 12px 0 8px; font-size: clamp(28px, 6vw, 40px); font-weight: 800; letter-spacing: -0.02em; }
    .subtitle { font-size: 16px; color: #94a3b8; margin: 0 0 28px; }
    
    .auth-box { padding: 24px; border: 1px solid #1e293b; border-radius: 16px; background: #1e293b66; backdrop-filter: blur(12px); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); margin-bottom: 24px; }
    .auth-box h2 { margin: 0 0 16px; font-size: 17px; font-weight: 700; color: #e2e8f0; }
    
    .auth-form { display: flex; flex-direction: column; gap: 12px; width: 100%; box-sizing: border-box; }
    .auth-form input, .note-form input, .note-form textarea {
      width: 100%; box-sizing: border-box; padding: 12px 16px;
      border: 1px solid #334155; border-radius: 10px;
      background: #0f172a; color: #f8fafc; font-size: 15px; outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .auth-form input:focus, .note-form input:focus, .note-form textarea:focus {
      border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }
    
    button, .btn {
      width: 100%; box-sizing: border-box; padding: 12px 18px; border: none; border-radius: 10px;
      background: #0284c7; color: #ffffff; font-weight: 600; font-size: 15px; cursor: pointer;
      transition: background .2s, transform .1s;
    }
    button:hover, .btn:hover { background: #0369a1; }
    button:active, .btn:active { transform: scale(0.99); }
    
    .btn-secondary { width: auto; padding: 8px 14px; background: #334155; font-size: 13px; border-radius: 8px; }
    .btn-secondary:hover { background: #475569; }
    .btn-danger { width: auto; padding: 8px 14px; background: #dc2626; color: #fff; font-size: 13px; border-radius: 8px; }
    .btn-danger:hover { background: #b91c1c; }
    
    .auth-status { display: flex; align-items: center; justify-content: space-between; }
    .auth-error { margin-top: 10px; color: #f87171; font-size: 14px; }

    .note-form { margin-top: 18px; padding-top: 18px; border-top: 1px solid #334155; display: flex; flex-direction: column; gap: 12px; }
    .note-form textarea { resize: vertical; min-height: 80px; font-family: inherit; }

    ul { list-style: none; display: flex; flex-direction: column; gap: 14px; padding: 0; margin: 0; }
    li.note-card {
      border: 1px solid #1e293b; border-radius: 14px; padding: 20px;
      background: #1e293b44; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
      transition: border-color .2s;
    }
    li.note-card:hover { border-color: #334155; }
    li.empty-card {
      border: 1px dashed #334155; border-radius: 14px; padding: 28px;
      background: transparent; color: #64748b; text-align: center; font-size: 15px;
    }
    
    .note-content { flex: 1; }
    strong { display: block; font-size: 17px; font-weight: 700; margin-bottom: 6px; color: #f1f5f9; }
    .note-content span { color: #94a3b8; font-size: 15px; line-height: 1.6; white-space: pre-wrap; }
    .note-actions { display: flex; gap: 8px; flex-shrink: 0; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 비밀창고 자료실</div>
    <h1>점령된 자료실</h1>
    <p class="subtitle">인증된 사용자만 내부 보관 자료를 열람하고 관리할 수 있습니다.</p>

    <!-- 로그인 및 메모 작성 컨테이너 -->
    <div class="auth-box" id="auth-container">
      <div id="login-section">
        <h2>사용자 로그인</h2>
        <form class="auth-form" id="login-form">
          <input type="email" id="login-email" placeholder="이메일 주소" required autocomplete="email" />
          <input type="password" id="login-password" placeholder="비밀번호" required autocomplete="current-password" />
          <button type="submit" id="btn-login">로그인</button>
        </form>
        <div class="auth-error" id="login-error" style="display: none;"></div>
      </div>

      <div id="user-section" style="display: none;">
        <div class="auth-status">
          <div>
            <span style="color: #38bdf8; font-weight: 600;">접속 계정: </span>
            <span id="user-email-display" style="color: #e2e8f0;"></span>
          </div>
          <button type="button" class="btn-secondary" id="btn-logout">로그아웃</button>
        </div>

        <form class="note-form" id="create-note-form">
          <input type="text" id="new-note-title" placeholder="새 메모 제목" required />
          <textarea id="new-note-body" placeholder="메모 본문 내용을 입력하세요" required></textarea>
          <button type="submit" id="btn-create-note">메모 추가하기</button>
        </form>
      </div>
    </div>

    <!-- 메모 목록 -->
    <ul id="notes" aria-live="polite">
      <li class="empty-card">로그인 상태를 확인하는 중입니다...</li>
    </ul>
  </main>

  <script type="module">
    const SUPABASE_URL = 'https://jrsoosoflveipirsqokx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impyc29vc29mbHZlaXBpcnNxb2t4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MDE1NzUsImV4cCI6MjEwNzE3NzU3NX0.RqMp0GvBXLDbn0pYDaVnKLY177E6z7XMzYhPRi7yIec';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginSection = document.querySelector('#login-section');
    const userSection = document.querySelector('#user-section');
    const loginForm = document.querySelector('#login-form');
    const emailInput = document.querySelector('#login-email');
    const passwordInput = document.querySelector('#login-password');
    const loginError = document.querySelector('#login-error');
    const userEmailDisplay = document.querySelector('#user-email-display');
    const btnLogout = document.querySelector('#btn-logout');
    const createNoteForm = document.querySelector('#create-note-form');
    const newNoteTitle = document.querySelector('#new-note-title');
    const newNoteBody = document.querySelector('#new-note-body');
    const list = document.querySelector('#notes');

    let currentSession = null;

    async function loadNotes() {
      if (!currentSession || !currentSession.access_token) {
        const item = document.createElement('li');
        item.className = 'empty-card';
        item.textContent = '로그인이 필요한 서비스입니다. 상단에서 로그인해 주세요.';
        list.replaceChildren(item);
        return;
      }

      try {
        const response = await fetch('/api/notes', {
          headers: {
            'authorization': 'Bearer ' + currentSession.access_token,
            'cache-control': 'no-store'
          }
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.message || '자료를 불러올 수 없습니다.');
        }

        const data = await response.json();
        if (!Array.isArray(data.notes)) throw new Error('자료 형식이 맞지 않습니다.');
        if (data.notes.length === 0) {
          const item = document.createElement('li');
          item.className = 'empty-card';
          item.textContent = '등록된 메모가 없습니다. 새 메모를 추가해 보세요.';
          list.replaceChildren(item);
          return;
        }

        list.replaceChildren(...data.notes.map(note => {
          const item = document.createElement('li');
          item.className = 'note-card';

          const contentDiv = document.createElement('div');
          contentDiv.className = 'note-content';
          const title = document.createElement('strong');
          const content = document.createElement('span');
          title.textContent = note.title;
          content.textContent = note.body || note.content || '';
          contentDiv.append(title, content);

          const actionsDiv = document.createElement('div');
          actionsDiv.className = 'note-actions';

          const editBtn = document.createElement('button');
          editBtn.className = 'btn-secondary';
          editBtn.textContent = '수정';
          editBtn.addEventListener('click', async () => {
            const newTitle = prompt('수정할 제목:', note.title);
            if (newTitle === null) return;
            const newBody = prompt('수정할 내용:', note.body || note.content || '');
            if (newBody === null) return;

            const res = await fetch('/api/notes/' + note.id, {
              method: 'PUT',
              headers: {
                'authorization': 'Bearer ' + currentSession.access_token,
                'content-type': 'application/json'
              },
              body: JSON.stringify({ title: newTitle, body: newBody })
            });
            if (res.ok) {
              loadNotes();
            } else {
              alert('수정 실패');
            }
          });

          const delBtn = document.createElement('button');
          delBtn.className = 'btn-danger';
          delBtn.textContent = '삭제';
          delBtn.addEventListener('click', async () => {
            if (!confirm("'" + note.title + "' 메모를 삭제하시겠습니까?")) return;
            const res = await fetch('/api/notes/' + note.id, {
              method: 'DELETE',
              headers: {
                'authorization': 'Bearer ' + currentSession.access_token
              }
            });
            if (res.ok) {
              loadNotes();
            } else {
              alert('삭제 실패');
            }
          });

          actionsDiv.append(editBtn, delBtn);
          item.append(contentDiv, actionsDiv);
          return item;
        }));
      } catch (error) {
        const item = document.createElement('li');
        item.className = 'empty-card';
        item.textContent = error.message;
        list.replaceChildren(item);
      }
    }

    function updateAuthState(session) {
      currentSession = session;
      if (session && session.user) {
        loginSection.style.display = 'none';
        userSection.style.display = 'block';
        userEmailDisplay.textContent = session.user.email;
        loginError.style.display = 'none';
      } else {
        loginSection.style.display = 'block';
        userSection.style.display = 'none';
        userEmailDisplay.textContent = '';
      }
      loadNotes();
    }

    const { data: { session: initSession } } = await supabase.auth.getSession();
    updateAuthState(initSession);

    supabase.auth.onAuthStateChange((_event, session) => {
      updateAuthState(session);
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.style.display = 'none';
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        loginError.textContent = '로그인 실패: ' + error.message;
        loginError.style.display = 'block';
      }
    });

    btnLogout.addEventListener('click', async () => {
      await supabase.auth.signOut();
    });

    createNoteForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentSession || !currentSession.access_token) return;
      const title = newNoteTitle.value.trim();
      const body = newNoteBody.value.trim();

      const res = await fetch('/api/notes', {
        method: 'POST',
        headers: {
          'authorization': 'Bearer ' + currentSession.access_token,
          'content-type': 'application/json'
        },
        body: JSON.stringify({ title, body })
      });

      if (res.ok) {
        newNoteTitle.value = '';
        newNoteBody.value = '';
        loadNotes();
      } else {
        alert('메모 생성 실패');
      }
    });
  </script>
</body>
</html>
